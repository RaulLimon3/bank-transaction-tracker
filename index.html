<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Transactions Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/main.js"></script>
</head>

<body>
    <main class="main">
        <div class="container tracker-container">
            <section class="summary">
                <h1 class="title">Current Balance</h1>
                <span class="balance" id="balance">$0.00</span>
            </section>
            <section class="form-container">
                <form class="form" id="form">
                    <div class="inputs inputs-radio">
                        <div class="radio">
                            <label>
                                <input type="radio" name="type" value="deposit">
                                Deposit
                            </label>
                        </div>
                        <div class="radio">
                            <label>
                                <input type="radio" name="type" value="withdrawal">
                                Withdrawal
                            </label>
                        </div>
                    </div>
                    <div class="inputs">
                        <label for="amount">Amount</label>
                        <input class="input" type="number" name="amount" id="amount" min="0.01" step="0.01"
                            placeholder="Enter amount">
                    </div>
                    <button type="submit">Complete operation</button>
                </form>
            </section>
            <section class="transaction-history">
                <div class="filters">
                    <select class="input" name="filter" id="filters">
                        <option value="" disabled selected>Filter</option>
                        <option value="all">All</option>
                        <option value="deposit">Deposit</option>
                        <option value="withdrawal">Withdrawal</option>
                    </select>
                </div>
                <ul class="history" id="history">
                </ul>
            </section>
        </div>
    </main>
</body>

</html>
